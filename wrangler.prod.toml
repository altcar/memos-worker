name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "8113d549-1924-44a2-90c8-58aab96366e5"
database_name = "notes-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "4ad3043713834ee68e3bf6b240f0d572"

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
